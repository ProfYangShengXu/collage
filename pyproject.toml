[project]
name = "collage"
version = "0.1.0"
description = "Lay out text and graphic components into an arbitrary shape (silhouette-aware collage typesetting)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Tingjun Chen" }]
keywords = ["typography", "layout", "collage", "silhouette", "generative-design"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "numpy>=1.24",
    "pillow>=10.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
collage = "collage.cli:main"

[project.urls]
Homepage = "https://github.com/ProfYangShengXu/collage"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["collage"]
